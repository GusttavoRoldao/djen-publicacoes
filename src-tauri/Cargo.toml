[package]
name = "djen-publicacoes"
version = "0.1.0"
description = "Acompanhamento local de publicações do DJEN"
edition = "2021"

[lib]
name = "djen_publicacoes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
keyring = { version = "4.1.6", default-features = false, features = ["v1", "windows-native-keyring-store"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
tauri-plugin-dialog = "2.7.2"
base64 = "0.23.1"
